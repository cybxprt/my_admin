name: Network agent tests

on:
  push:
    paths:
      - "agents/local-agent/**"
      - "tests/test_tenda_monitor.py"
      - ".github/workflows/network-agent-tests.yml"
  pull_request:
    paths:
      - "agents/local-agent/**"
      - "tests/test_tenda_monitor.py"
      - ".github/workflows/network-agent-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_tenda_monitor.py -v

  app-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/my_admin
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/my_admin
      - run: npm run type-check
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/my_admin
