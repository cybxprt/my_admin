name: Network agent tests

on:
  push:
    paths:
      - "agents/local-agent/**"
      - "tests/test_tenda_monitor.py"
      - ".github/workflows/network-agent-tests.yml"
  pull_request:
    paths:
      - "agents/local-agent/**"
      - "tests/test_tenda_monitor.py"
      - ".github/workflows/network-agent-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_tenda_monitor.py -v
